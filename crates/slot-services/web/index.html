<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRAVY Manager</title>
<style>
:root { --bg: #0b0e11; --panel: #14181d; --line: #262c33; --fg: #eef0f4; --dim: #8a929c; }
:root[data-theme="light"] { --bg: #f3f3f0; --panel: #ffffff; --line: #d6d8dc; --fg: #14171b; --dim: #6c737c; }
:root[data-theme="light"] .logo { filter: invert(1); }
/* The menu's own switch: an outlined pill when off, a filled one with the knob cut out when on. */
.theme { position: absolute; top: 16px; right: 16px; background: none; border: 0; padding: 4px; color: var(--fg); cursor: pointer; line-height: 0; }
.theme .on, :root[data-theme="light"] .theme .off { display: none; }
:root[data-theme="light"] .theme .on { display: inline; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { position: relative; max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
.logo { display: block; margin: 0 auto; height: 34px; width: auto; }
header { text-align: center; margin-bottom: 26px; }
.sub { font-size: 11px; letter-spacing: .3em; color: var(--dim); margin-top: 10px; text-transform: uppercase; }
#msg { min-height: 20px; margin: -8px 0 4px; text-align: center; font-size: 13px; color: var(--dim); }
nav { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
nav button { flex: 1 0 auto; background: none; border: 0; color: var(--dim); font: inherit; font-weight: 600; letter-spacing: .08em;
  padding: 10px 4px; border-bottom: 2px solid transparent; cursor: pointer; }
nav .sep { flex: none; width: 1px; margin: 10px 4px 12px; background: var(--line); }
.drop[hidden] { display: none; }
/* Screenshots as a gallery: the picture, its game and time, then the buttons. */
ul.shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin-top: 20px; }
ul.shots li { flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; padding: 10px; gap: 6px 8px; }
ul.shots li img.thumb { width: 100%; height: auto; aspect-ratio: 4 / 3; }
ul.shots li .name { flex-basis: 100%; }
ul.shots li .size { flex-basis: 100%; }
ul.shots li button { flex: 1; }
nav button.on { color: var(--fg); border-bottom-color: var(--fg); }
.drop { display: block; margin: 20px 0; border: 1px dashed var(--line); border-radius: 10px; padding: 22px; text-align: center; color: var(--dim); cursor: pointer; }
.drop b { color: var(--fg); font-weight: 600; }
.drop.over { border-color: var(--fg); color: var(--fg); }
.bar { height: 3px; background: var(--line); border-radius: 2px; margin-top: 12px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--fg); }
ul { list-style: none; margin: 0; padding: 0; }
li { display: flex; align-items: center; gap: 12px; padding: 11px 4px; border-bottom: 1px solid var(--line); }
li .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
li .size { color: var(--dim); font-size: 13px; white-space: nowrap; }
li button { background: none; border: 1px solid var(--line); color: var(--fg); border-radius: 6px; font: inherit; font-size: 13px; padding: 4px 10px; cursor: pointer; }
li button:hover { border-color: var(--fg); }
li input { flex: 1; background: var(--panel); border: 1px solid var(--fg); color: var(--fg); font: inherit; padding: 4px 8px; border-radius: 6px; }
footer { margin-top: 18px; color: var(--dim); font-size: 12px; display: flex; justify-content: space-between; }
.pin { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
.pin input { width: 150px; text-align: center; font: 600 30px system-ui; letter-spacing: .4em; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
@media (max-width: 520px) { main { padding-top: 56px; } .theme { top: 12px; } nav { flex-wrap: wrap; } nav .sep.row { flex-basis: 100%; height: 0; margin: 0; } nav button { font-size: 11px; letter-spacing: .03em; padding: 10px 2px; } nav .sep { margin: 10px 2px 12px; } li { flex-wrap: wrap; gap: 6px 10px; } li .name { flex-basis: 100%; } li:has(.thumb) .name { flex-basis: calc(100% - 92px); } li .size { flex: 1; } ul.shots li:has(.thumb) .name, ul.shots li .size { flex-basis: 100%; } ul.shots { grid-template-columns: 1fr 1fr; gap: 10px; } }
.pin[hidden], .viewer[hidden] { display: none; }
li img.thumb { width: 80px; height: 60px; object-fit: cover; border-radius: 4px; background: var(--panel); border: 1px solid var(--line); cursor: zoom-in; flex: none; }
.viewer { position: fixed; inset: 0; background: rgba(0, 0, 0, .85); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; cursor: zoom-out; z-index: 2; }
.viewer img { max-width: min(100%, 960px); max-height: 80vh; border-radius: 6px; }
.viewer p { margin: 0; color: #eef0f4; font-size: 13px; }
.pin p { color: var(--dim); margin: 0; font-size: 13px; }
.update { margin: 28px 0 8px; text-align: center; }
.update[hidden] { display: none; }
.update h2 { margin: 0 0 4px; font-size: 22px; font-weight: 600; }
.update p { margin: 0 0 18px; color: var(--dim); font-size: 13px; }
.update button { background: var(--fg); color: var(--bg); border: 0; border-radius: 8px; font: inherit; font-weight: 600; padding: 10px 22px; cursor: pointer; }
.update button[disabled] { opacity: .4; cursor: default; }
.update .bar { max-width: 320px; margin: 0 auto 18px; }
</style>
</head>
<body>
<main>
  <button class="theme" id="theme" aria-label="Light" title="Light"><svg width="46" height="26" viewBox="0 0 46 26">
    <g class="off"><rect x="1" y="1" width="44" height="24" rx="12" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="13" cy="13" r="6.5" fill="currentColor"/></g>
    <g class="on"><mask id="cut"><rect width="46" height="26" fill="#fff"/><circle cx="33" cy="13" r="8" fill="#000"/></mask><rect x="1" y="1" width="44" height="24" rx="12" fill="currentColor" mask="url(#cut)"/></g>
  </svg></button>
  <header>
    <img class="logo" src="logo.png" alt="slot. x GRAVY">
    <div class="sub">Manager</div>
  </header>
  <nav id="tabs"></nav>
  <div class="update" id="update" hidden></div>
  <label class="drop" id="drop"><b>Drop files here</b> or tap to choose<input type="file" multiple hidden id="pick">
    <div id="up"></div></label>
  <div id="msg"></div>
  <ul id="list"></ul>
  <footer><span id="count"></span><span id="free"></span></footer>
</main>
<div class="viewer" id="viewer" hidden><img id="big" alt=""><p id="bigname"></p></div>
<div class="pin" id="lock" hidden>
  <div class="sub">Enter PIN</div>
  <input id="pin" inputmode="numeric" maxlength="4" autocomplete="off">
  <p id="pinwhy">Shown on your console under Network › GRAVY Manager</p>
</div>
<script>
// Light or dark, remembered on this browser only.
function theme(light) {
  document.documentElement.dataset.theme = light ? "light" : "dark";
  $("theme").setAttribute("aria-pressed", light);
}
const SYS = ["GB", "GBC", "GBA", "NES", "SNES", "BIOS", "WALLPAPERS", "SCREENSHOTS", "UPDATE"];
const UPDATE = s => s == "UPDATE";
const SHOTS = s => s == "SCREENSHOTS";
const PICTURES = s => s == "WALLPAPERS" || s == "SCREENSHOTS";
const NAME = {};
const GAMES = s => SYS.indexOf(s) < 5;
const EXT = { gb: "GB", gbc: "GBC", gba: "GBA", nes: "NES", sfc: "SNES", smc: "SNES", bin: "BIOS", png: "WALLPAPERS" };
let sys = "GB", data = null, pin = "", renaming = null;
try { pin = sessionStorage.getItem("pin") || ""; sys = sessionStorage.getItem("sys") || sys; } catch (e) {}
// Scanned from the console's QR code: the PIN comes in after the #, then leaves the address bar.
const scanned = location.hash.match(/pin=(\d{4})/);
if (scanned) { pin = scanned[1]; history.replaceState(null, "", "/"); try { sessionStorage.setItem("pin", pin); } catch (e) {} }
const $ = id => document.getElementById(id);
const esc = t => t.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const size = n => n < 1048576 ? Math.round(n / 1024) + " KB" : (n / 1048576).toFixed(1) + " MB";
const url = (s, n) => "/api/games/" + s + "/" + encodeURIComponent(n);
function say(t) { $("msg").textContent = t || ""; }

async function api(method, path, body) {
  const r = await fetch(path, { method, body, headers: { "X-Pin": pin } });
  if (r.status == 401 || r.status == 403) { locked(await r.text()); throw new Error(""); }
  if (!r.ok) throw new Error(await r.text());
  return r;
}
function locked(why) {
  pin = "";
  $("lock").hidden = false;
  $("pin").value = "";
  if (why && why != "Wrong PIN") $("pinwhy").textContent = why;
  $("pin").focus();
}
$("pin").oninput = async () => {
  const v = $("pin").value.replace(/\D/g, "");
  $("pin").value = v;
  if (v.length < 4) return;
  pin = v;
  try { await load(); $("lock").hidden = true; try { sessionStorage.setItem("pin", pin); } catch (e) {} }
  catch (e) { $("pinwhy").textContent = "Wrong PIN, try again"; }
};

async function load() {
  data = await (await api("GET", "/api/list")).json();
  render();
}
function render() {
  // Thin lines keep games, BIOS, wallpapers and screenshots apart; on a phone the first one
  // breaks the tabs into two rows.
  $("tabs").innerHTML = SYS.map(s => (s == "BIOS" ? '<i class="sep row"></i>' : s == "WALLPAPERS" || s == "SCREENSHOTS" || s == "UPDATE" ? '<i class="sep"></i>' : "") +
    `<button class="${s == sys ? "on" : ""}" data-s="${s}">${NAME[s] || s}</button>`).join("");
  const games = data && data.systems[sys] || [];
  $("drop").hidden = SHOTS(sys);
  $("update").hidden = !UPDATE(sys);
  $("drop").querySelector("b").textContent = UPDATE(sys) ? "Drop a slot. x GRAVY zip here" : "Drop files here";
  $("list").hidden = $("count").hidden = UPDATE(sys);
  if (UPDATE(sys)) { updated(); return; }
  $("list").className = SHOTS(sys) ? "shots" : "";
  if (SHOTS(sys)) $("list").innerHTML = games.length ? games.map(([n, b], i) => {
    const [game, when] = caption(n);
    return `<li><img class="thumb" data-view="${i}" alt=""><span class="name">${esc(game)}</span><span class="size">${when}</span>` +
      `<button data-get="${i}">Download</button><button data-del="${i}">Delete</button></li>`;
  }).join("") : `<li><span class="name" style="color:var(--dim)">No screenshots yet</span></li>`;
  else $("list").innerHTML = games.length ? games.map(([n, b], i) => renaming == n
    ? `<li><input id="to" value="${esc(n)}"><button data-save="${i}">Save</button><button data-cancel>Cancel</button></li>`
    : `<li>${PICTURES(sys) ? `<img class="thumb" data-view="${i}" alt="">` : ""}<span class="name">${esc(n)}</span><span class="size">${size(b)}</span>` +
      `<button data-ren="${i}">Rename</button><button data-del="${i}">Delete</button></li>`).join("")
    : `<li><span class="name" style="color:var(--dim)">Nothing here yet</span></li>`;
  const what = GAMES(sys) ? " game" : SHOTS(sys) ? " screenshot" : " file";
  $("count").textContent = games.length + what + (games.length == 1 ? "" : "s");
  $("free").textContent = data ? (data.free / 1073741824).toFixed(1) + " GB free on SD card" : "";
  if (PICTURES(sys)) thumbs(games);
  const to = $("to");
  if (to) { to.focus(); to.setSelectionRange(0, to.value.lastIndexOf(".")); to.onkeydown = e => {
    if (e.key == "Enter") $("list").querySelector("[data-save]").click();
    if (e.key == "Escape") { renaming = null; render(); } }; }
}
// "GB/Tetris 2026-10-20_09-14-02 2.png" as its game and when it was taken.
function caption(n) {
  const m = n.replace(/^.*\//, "").replace(/\.png$/i, "").match(/^(.*) (\d{4})-(\d\d)-(\d\d)_(\d\d)-(\d\d)-\d\d( \d+)?$/);
  if (!m) return [n, ""];
  const month = "Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec".split(" ")[m[3] - 1];
  return [m[1] == "slot" ? "Menu" : m[1], `${+m[4]} ${month} ${m[2]} · ${m[5]}:${m[6]}`];
}
// Pictures are fetched with the PIN and kept while the page is open.
const pictures = {};
async function picture(name, bytes, from = sys) {
  const key = from + "/" + name + ":" + bytes;
  if (!pictures[key]) pictures[key] = api("GET", url(from, name)).then(r => r.blob()).then(URL.createObjectURL);
  return pictures[key];
}
async function download(i) {
  const [n, b] = data.systems[sys][i];
  const a = document.createElement("a");
  a.href = await picture(n, b);
  a.download = n.replace(/^.*\//, "");
  a.click();
}
function thumbs(games) {
  $("list").querySelectorAll("img.thumb").forEach(img => {
    const [n, b] = games[img.dataset.view];
    picture(n, b).then(src => img.src = src).catch(() => {});
  });
}
async function view(i) {
  const [n, b] = data.systems[sys][i];
  $("big").src = await picture(n, b);
  $("bigname").textContent = SHOTS(sys) ? caption(n).filter(Boolean).join(" · ") : n;
  $("viewer").hidden = false;
}
$("viewer").onclick = () => $("viewer").hidden = true;
document.addEventListener("keydown", e => { if (e.key == "Escape") $("viewer").hidden = true; });
$("tabs").onclick = e => {
  const s = e.target.dataset.s;
  if (!s) return;
  sys = s; renaming = null; say();
  try { sessionStorage.setItem("sys", s); } catch (e) {}
  render();
  if (UPDATE(s)) checkUpdate();
};
$("list").onclick = async e => {
  const d = e.target.dataset, games = data.systems[sys];
  try {
    if (d.view) return view(d.view);
    if (d.get) return download(d.get);
    if (d.ren) { renaming = games[d.ren][0]; return render(); }
    if ("cancel" in d) { renaming = null; return render(); }
    if (d.save) {
      const from = games[d.save][0], to = $("to").value.trim();
      await api("POST", "/api/rename/" + sys + "/" + encodeURIComponent(from), to);
      renaming = null; say("Renamed to " + to);
    }
    if (d.del) {
      const n = games[d.del][0];
      if (!confirm("Delete " + n + "?" + (GAMES(sys) ? "\nIts saves stay on the card." : ""))) return;
      await api("DELETE", url(sys, n));
      say("Deleted " + n);
    }
    await load();
  } catch (err) { if (err.message) say(err.message); }
};

function send(file, to, path) {
  return new Promise((done, fail) => {
    const x = new XMLHttpRequest();
    x.open("PUT", path || url(to, file.name));
    x.setRequestHeader("X-Pin", pin);
    x.upload.onprogress = e => {
      const p = Math.round(100 * e.loaded / e.total);
      $("up").innerHTML = `<div style="margin-top:12px;color:var(--fg)">${esc(file.name)} · ${p}%</div><div class="bar"><i style="width:${p}%"></i></div>`;
    };
    x.onload = () => x.status == 200 ? done() : (x.status == 401 && locked(), fail(new Error(file.name + ": " + x.responseText)));
    x.onerror = () => fail(new Error(file.name + ": the console stopped answering"));
    x.send(file);
  });
}
// The update tab: the newest release on GitHub, or a zip dropped on the page, is put beside
// the running version; Install restarts the console into it.
let update = null, polling = null;
async function checkUpdate() {
  try { update = await (await api("GET", "/api/update")).json(); } catch (e) { return; }
  updated();
  clearTimeout(polling);
  if (UPDATE(sys) && (update.state == "checking" || update.state == "downloading")) polling = setTimeout(checkUpdate, 1000);
}
function updated() {
  if (!UPDATE(sys)) return;
  const u = update || { state: "idle", installed: "" }, have = u.installed || "an older version";
  const [title, note, button] = {
    idle: ["slot. x GRAVY " + (u.installed || ""), "Look for a newer version on GitHub.", "Check for update"],
    checking: ["Checking...", "Asking GitHub for the newest release.", ""],
    latest: ["Up to date", "You have the newest version, " + u.version + ".", "Check again"],
    available: [u.version + " is out", "You have " + have + ". Games, saves and settings stay as they are.", "Download"],
    downloading: ["Downloading " + u.version, u.total ? size(u.done) + " of " + size(u.total) : size(u.done), ""],
    ready: [(u.version || "The update") + " is ready", "The console restarts into it. If it doesn't start, the next start goes back to " + have + ".", "Install"],
    failed: ["That didn't work", u.error, "Try again"],
  }[u.state];
  const p = u.total ? Math.round(100 * u.done / u.total) : 0;
  $("update").innerHTML = `<h2>${esc(title.trim())}</h2><p>${esc(note || "")}</p>` +
    (u.state == "downloading" ? `<div class="bar"><i style="width:${p}%"></i></div>` : "") +
    (button ? `<button id="go" data-state="${u.state}">${button}</button>` : "");
  const go = $("go");
  if (go) go.onclick = async () => {
    try {
      if (u.state == "available") await api("POST", "/api/update/download");
      else if (u.state == "ready") {
        if (!confirm("Install " + (u.version || "the update") + "? The console restarts.")) return;
        await api("POST", "/api/update/install");
        $("update").innerHTML = "<h2>Restarting...</h2><p>The console starts the new version in a moment. This page closes with it.</p>";
        return;
      } else await api("POST", "/api/update/check");
    } catch (err) { if (err.message) say(err.message); }
    checkUpdate();
  };
}
async function add(files) {
  if (UPDATE(sys)) {
    const zip = files.find(f => /\.zip$/i.test(f.name));
    if (!zip) return say("Drop the slot. x GRAVY zip, as it comes from GitHub");
    try { await send(zip, null, "/api/update/zip"); say(); } catch (err) { say(err.message); }
    $("up").innerHTML = "";
    return checkUpdate();
  }
  let added = 0, last = sys;
  for (const f of files) {
    // Each game goes to the shelf its file says, whichever tab is open.
    const ext = f.name.split(".").pop().toLowerCase();
    // A .gb on the GBC tab and a Super Game Boy .sfc on the BIOS tab stay where they are dropped.
    const stays = (sys == "GBC" && ext == "gb") || (sys == "BIOS" && (ext == "sfc" || ext == "smc"));
    const to = EXT[ext] && !stays ? EXT[ext] : sys;
    try { await send(f, to); added++; last = to; } catch (err) { say(err.message); }
  }
  $("up").innerHTML = "";
  if (added) { sys = last; say(added == 1 ? "Added " + files[0].name : "Added " + added + " files"); }
  await load().catch(() => {});
}
$("pick").onchange = () => { add([...$("pick").files]); $("pick").value = ""; };
const drop = $("drop");
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); add([...e.dataTransfer.files]); };

let light = false;
try { light = localStorage.getItem("theme") == "light"; } catch (e) {}
theme(light);
$("theme").onclick = () => {
  light = !light;
  theme(light);
  try { localStorage.setItem("theme", light ? "light" : "dark"); } catch (e) {}
};
render();
load().then(() => UPDATE(sys) && checkUpdate()).catch(() => {});
</script>
</body>
</html>
