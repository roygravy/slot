<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRAVY Manager</title>
<style>
:root { --bg: #0b0e11; --panel: #14181d; --line: #262c33; --fg: #eef0f4; --dim: #8a929c; }
:root[data-theme="light"] { --bg: #f3f3f0; --panel: #ffffff; --line: #d6d8dc; --fg: #14171b; --dim: #6c737c; }
:root[data-theme="light"] .logo { filter: invert(1); }
/* The menu's own switch: an outlined pill when off, a filled one with the knob cut out when on. */
.theme { position: absolute; top: 16px; right: 16px; background: none; border: 0; padding: 4px; color: var(--fg); cursor: pointer; line-height: 0; }
.theme .on, :root[data-theme="light"] .theme .off { display: none; }
:root[data-theme="light"] .theme .on { display: inline; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { position: relative; max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
.logo { display: block; margin: 0 auto; height: 34px; width: auto; }
header { text-align: center; margin-bottom: 26px; }
.sub { font-size: 11px; letter-spacing: .3em; color: var(--dim); margin-top: 10px; text-transform: uppercase; }
#msg { min-height: 20px; margin: -8px 0 4px; text-align: center; font-size: 13px; color: var(--dim); }
/* Two rows of tabs, every tab the same width: the games, then the card's other folders and the
   console's own pages. On a phone the second row folds into two rows of three. */
nav { border-bottom: 1px solid var(--line); }
nav .row { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
nav .row + .row { border-top: 1px solid var(--line); }
nav button { position: relative; background: none; border: 0; color: var(--dim); font: inherit; font-size: 12px; font-weight: 600; letter-spacing: .07em;
  text-transform: uppercase; white-space: nowrap; padding: 11px 4px 9px; border-bottom: 2px solid transparent; cursor: pointer; }
.drop[hidden] { display: none; }
/* Screenshots as a gallery like the phone's own photos: the picture edge to edge, its game and
   time under it, and two small round buttons beside them that never wrap. */
ul.shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 18px 14px; margin-top: 20px; }
ul.shots li { display: block; min-width: 0; padding: 0; border: 0; }
ul.shots li img.thumb { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 8px; }
ul.shots .cap { display: flex; align-items: flex-start; gap: 4px; margin-top: 8px; }
ul.shots .cap div { flex: 1; min-width: 0; }
ul.shots .cap .size { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
ul.shots .cap .name { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; white-space: normal; overflow-wrap: anywhere; font-size: 14px; font-weight: 600; line-height: 1.25; }
ul.shots .cap .size { font-size: 12px; }
li button.ico { flex: none; width: 30px; height: 30px; padding: 0; border-radius: 50%; display: grid; place-items: center; color: var(--fg); }
button.ico svg { pointer-events: none; }
ul.shots li.none { grid-column: 1 / -1; }
nav button.on { color: var(--fg); border-bottom-color: var(--fg); }
.drop { display: block; margin: 20px 0; border: 1px dashed var(--line); border-radius: 10px; padding: 22px; text-align: center; color: var(--dim); cursor: pointer; }
.drop b { color: var(--fg); font-weight: 600; }
.drop.over { border-color: var(--fg); color: var(--fg); }
.bar { height: 3px; background: var(--line); border-radius: 2px; margin-top: 12px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--fg); }
ul { list-style: none; margin: 0; padding: 0; }
li { display: flex; align-items: center; gap: 12px; padding: 11px 4px; border-bottom: 1px solid var(--line); }
li .txt { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 12px; }
li .txt .name { flex: 1; }
li .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
li .size { color: var(--dim); font-size: 13px; white-space: nowrap; }
li button { background: none; border: 1px solid var(--line); color: var(--fg); border-radius: 6px; font: inherit; font-size: 13px; padding: 4px 10px; cursor: pointer; }
li button:hover { border-color: var(--fg); }
li input { flex: 1; background: var(--panel); border: 1px solid var(--fg); color: var(--fg); font: inherit; font-size: 16px; padding: 4px 8px; border-radius: 6px; }
footer { margin-top: 18px; color: var(--dim); font-size: 12px; display: flex; justify-content: space-between; }
#free { margin-left: auto; }
li.label .lthumb { height: 44px; width: auto; max-width: 72px; border-radius: 4px; object-fit: contain; flex: none; }
/* Sorting the games: four words in a row, the chosen one a filled pill; tapped again it turns
   round (newest or oldest, most or least played, with or without a label first). */
.sort { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 4px 0 6px; }
.sort[hidden] { display: none; }
.sort span { color: var(--dim); font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; margin-right: 4px; }
.sort button { background: none; border: 0; border-radius: 999px; color: var(--dim); font: inherit; font-size: 12px; font-weight: 600; letter-spacing: .05em;
  text-transform: uppercase; padding: 5px 11px; cursor: pointer; white-space: nowrap; }
.sort button.on { background: var(--fg); color: var(--bg); }
/* On a phone the four fit on one line: the word Sort goes, the pills come closer. */
@media (max-width: 520px) { .sort { flex-wrap: nowrap; gap: 2px; } .sort span { display: none; } .sort button { font-size: 11px; letter-spacing: .04em; padding: 5px 9px; } }
.pin { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
.pin .keep { color: var(--dim); font-size: 14px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
.pin .keep input { width: 18px; height: 18px; padding: 0; letter-spacing: 0; accent-color: var(--fg); }
.pin input#pin { width: 150px; text-align: center; font: 600 30px system-ui; letter-spacing: .4em; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
@media (max-width: 520px) { main { padding-top: 56px; } .theme { top: 12px; } nav .row.more { grid-auto-flow: row; grid-template-columns: repeat(6, minmax(0, 1fr)); } nav .row.more button { grid-column: span 2; } nav .row.more button:nth-child(n+4) { grid-column: span 3; } nav .row.more:has(> :nth-child(6)) button { grid-column: span 2; } nav button { font-size: 11px; letter-spacing: .05em; padding: 11px 2px 9px; } li { gap: 8px; } li:has(input) { flex-wrap: wrap; } li:has(input) input { flex-basis: 100%; } li .txt { flex-direction: column; align-items: stretch; gap: 2px; } li .txt .size { font-size: 12px; } ul.shots { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 12px; } }
.pin[hidden], .viewer[hidden], ul[hidden] { display: none; }
li img.thumb { width: 80px; height: 60px; object-fit: cover; border-radius: 4px; background: var(--panel); border: 1px solid var(--line); cursor: zoom-in; flex: none; }
.viewer { position: fixed; inset: 0; background: rgba(0, 0, 0, .85); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; cursor: zoom-out; z-index: 2; }
.viewer img { max-width: min(100%, 960px); max-height: 80vh; border-radius: 6px; }
.viewer p { margin: 0; color: #eef0f4; font-size: 13px; }
.pin p { color: var(--dim); margin: 0; font-size: 13px; }
.update { margin: 28px 0 8px; text-align: center; }
.update[hidden] { display: none; }
.update h2 { margin: 0 0 4px; font-size: 22px; font-weight: 600; }
.update p { margin: 0 0 18px; color: var(--dim); font-size: 13px; }
.update button { background: var(--fg); color: var(--bg); border: 0; border-radius: 8px; font: inherit; font-weight: 600; padding: 10px 22px; cursor: pointer; }
.update button[disabled] { opacity: .4; cursor: default; }
.update input { display: block; width: 100%; max-width: 320px; box-sizing: border-box; margin: 0 auto 10px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--fg); font: inherit; }
.update .bar { max-width: 320px; margin: 0 auto 18px; }
/* BaseOS's card under the release notes, a line apart from slot. x GRAVY's. */
.update .base { max-width: 520px; margin: 30px auto 0; border-top: 1px solid var(--line); padding-top: 26px; }
.notes { max-width: 520px; margin: 26px auto 0; text-align: left; border-top: 1px solid var(--line); padding-top: 18px; font-size: 14px; line-height: 1.5; }
.notes h3 { margin: 18px 0 6px; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
.notes h3:first-child { margin-top: 0; }
.notes p { margin: 0 0 10px; color: inherit; font-size: 14px; }
.notes ul { margin: 0 0 10px; padding: 0 0 0 20px; list-style: disc; }
.notes li { display: list-item; margin: 0 0 6px; padding: 0; border: 0; }
.notes code { font-size: 12px; }
.notes a, .update .gh { color: inherit; }
/* The update dot hangs beside the word, so the tab keeps its width and the word its centre. */
nav button.new span { position: relative; }
nav button.new span::after { content: ""; position: absolute; left: 100%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 5px; border-radius: 50%; background: var(--fg); }
.news { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 14px; padding: 10px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; font-size: 14px; }
.news[hidden] { display: none; }
.news span { color: var(--dim); }
.news b { color: var(--fg); font-weight: 600; }
.news button { background: var(--fg); color: var(--bg); border: 0; border-radius: 8px; font: inherit; font-size: 13px; font-weight: 600; padding: 6px 14px; cursor: pointer; flex: none; }
.update .gh { display: inline-block; margin-top: 14px; font-size: 13px; color: var(--dim); }
/* Achievements tab (Roy, ra4): the buttons side by side on one line, the logo grey at the foot. */
.update p a { color: inherit; }
.update .btns { display: flex; justify-content: center; gap: 10px; margin-top: 4px; }
.update .btns button.alt { background: none; color: var(--fg); border: 1px solid var(--line); }
.update a.ra { display: inline-flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 34px; color: var(--dim); font-size: 12px; text-decoration: none; }

let sortBy = "az", sortBack = false;

    probe.onload = () => {

const $ = id => document.getElementById(id);
const esc = t => t.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

const url = (s, n) => "/api/games/" + s + "/" + encodeURIComponent(n);
function say(t) { $("msg").textContent = t || ""; }

async function api(method, path, body) {
  const r = await fetch(path, { method, body, headers: { "X-Pin": pin, "X-Key": key } });
  if (r.status == 401 || r.status == 403) { locked(await r.text()); throw new Error(""); }
  if (!r.ok) throw new Error(await r.text());
  return r;
}
function locked(why) {

  key = "";

  $("pin").value = "";

  $("pin").focus();
}
$("pin").oninput = async () => {

  $("pin").value = v;
  if (v.length < 4) return;
  pin = v;
  try {
    await load(); $("lock").hidden = true; lookOnce(); try { sessionStorage.setItem("pin", pin); } catch (e) {}
    if ($("keep").checked) {
      try { key = await (await api("POST", "/api/remember")).text(); localStorage.setItem("key", key); } catch (e) {}
    }
  }
  catch (e) { $("pinwhy").textContent = "Wrong PIN, try again"; }

async function load() {
  data = await (await api("GET", "/api/list")).json();
  // The console's own A-Z order, kept to come back to: name, size, label, added, played, place.
  SYS.filter(GAMES).forEach(s => (data.systems[s] || []).forEach((g, i) => g[5] = i));
  render();
}
function sortGames(games) {
  const az = (a, b) => a[5] - b[5];
  const by = { az, added: (a, b) => b[3] - a[3], played: (a, b) => b[4] - a[4], label: (a, b) => b[2] - a[2] }[sortBy] || az;
  // Turned round, the order flips but games alike stay A-Z.
  games.sort((a, b) => (sortBack ? by(b, a) : by(a, b)) || az(a, b));
}
function played(secs) {
  const m = Math.round(secs / 60);
  return m < 60 ? m + " min" : Math.floor(m / 60) + " h" + (m % 60 ? " " + (m % 60) + " min" : "");
}
function render() {

  const games = data && data.systems[sys] || [];
  $("sort").hidden = !GAMES(sys) || games.length < 2;

  $("list").hidden = $("count").hidden = UPDATE(sys) || RA(sys);

  if (LOGS(sys)) {

// Sorted by when added or by play time, each game shows that too.
function extra(g) {
  if (sortBy == "added" && g[3]) return " · " + new Date(g[3] * 1000).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
  if (sortBy == "played") return g[4] >= 60 ? " · " + played(g[4]) : " · Not played";
  return "";
}
$("sort").onclick = e => {

  if (!k) return;

// "GB/Tetris 2026-10-20_09-14-02 2.png" as its game and when it was taken.
function caption(n) {
  const m = n.replace(/^.*\//, "").replace(/\.png$/i, "").match(/^(.*) (\d{4})-(\d\d)-(\d\d)_(\d\d)-(\d\d)-\d\d( \d+)?$/);
  if (!m) return [n, ""];
  const month = "Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec".split(" ")[m[3] - 1];
  // This year's pictures leave the year out, so the time fits beside the buttons on a phone.
  const year = m[2] == new Date().getFullYear() ? "" : " " + m[2];
  return [m[1] == "slot" ? "Menu" : m[1], `${+m[4]} ${month}${year} · ${m[5]}:${m[6]}`];
}
// Pictures are fetched with the PIN and kept while the page is open.
const pictures = {};
async function picture(name, bytes, from = sys) {

// A game's own label: any picture from the phone, sent to the console as a PNG no larger than

function labelPicture(name) {

$("labelpick").onchange = async () => {
  const f = $("labelpick").files[0], game = labelFor;
  if (!f || !game) return;
  try {
    const img = await createImageBitmap(f);
    const k = Math.min(1, 1024 / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const png = await new Promise(ok => c.toBlob(ok, "image/png"));
    await api("PUT", "/api/label/" + sys + "/" + encodeURIComponent(game), png);
    delete labelPics[sys + "/" + game]; labeling = null;
    say("New label for " + game.replace(/\.[^.]*$/, "")); await load();

function send(file, to, path) {
  return new Promise((done, fail) => {
    const x = new XMLHttpRequest();
    let over = false, watching = null;
    const finish = ok => { if (over) return; over = true; clearInterval(watching); ok ? done() : fail(ok === false ? new Error(file.name + ": the console stopped answering") : ok); };
    // Is the whole file on the console's list? Then it landed, whatever the browser heard.
    const landed = async () => {
      if (!to) return false;
      try {
        const now = await (await api("GET", "/api/list")).json();
        return (now.systems[to] || []).some(([n, b]) => n == file.name && b == file.size);
      } catch (e) { return false; }
    };
    const shown = p => $("up").innerHTML = `<div style="margin-top:12px;color:var(--fg)">${esc(file.name)} · ${p}</div><div class="bar"><i style="width:${p == "done" || p == "saving on the console..." ? 100 : parseInt(p)}%"></i></div>`;
    x.open("PUT", path || url(to, file.name));
    x.setRequestHeader("X-Pin", pin);
    x.setRequestHeader("X-Key", key);
    x.upload.onprogress = e => {
      const p = e.total ? Math.round(100 * e.loaded / e.total) : 0;
      // At 100% the console still writes the file to its card, which can take a while.
      shown(p < 100 ? p + "%" : "saving on the console...");
    };
    // Some phones (Safari) never hear the answer after a big upload: once everything is
    // sent, look on the list as well, so the upload always ends.
    x.upload.onload = () => {
      shown("saving on the console...");
      if (to && !watching) watching = setInterval(async () => { if (await landed()) { x.abort(); finish(true); } }, 1500);
    };
    x.onload = async () => {
      if (x.status == 200) return finish(true);
      if (x.status == 401) { locked(); return finish(new Error(file.name + ": " + x.responseText)); }
      // Sent twice by the browser: the first one is already there.
      if (await landed()) return finish(true);
      finish(new Error(file.name + ": " + x.responseText));
    };
    x.onerror = async () => finish(await landed() ? true : false);
    x.send(file);
  });
}

// The update tab: the newest release on GitHub, or a zip dropped on the page, is put beside
// the running version; Install restarts the console into it.
let update = null, polling = null, quiet = false;
async function checkUpdate() {

  if (quiet && update.state == "failed") update.state = "idle";

}
function updated() {

  const [title, note, button] = {

    checking: ["Checking...", "Asking GitHub for the newest release.", ""],
    latest: ["slot. x GRAVY is up to date", "You have the newest version, " + u.version + ".", "Check again"],
    available: [u.version + " is out", "You have " + have + ". Games, saves and settings stay as they are.", "Download"],
    downloading: ["Downloading " + u.version, u.total ? size(u.done) + " of " + size(u.total) : size(u.done), ""],
    ready: [(u.version || "The update") + " is ready", "The console restarts into it. If it doesn't start, the next start goes back to " + have + ".", "Install"],
    failed: ["That didn't work", u.error, "Try again"],

    (button ? `<button id="go" data-state="${u.state}">${button}</button>` : "");

  $("after").innerHTML = notes(u) + baseos(u);
  baseosButton();

        await api("POST", "/api/update/install");

        return;

// BaseOS has its own card under slot. x GRAVY's, built the same way: the version the console runs,
// a button that asks GitHub, and when the release has the update file made for this console it
// comes onto the card from here and Install restarts the console into it.
function baseos(u) {
  const b = u.baseos;
  if (!b) return "";
  const ver = b.version || "", have = b.installed;
  const [title, note, button] = {
    idle: ["BaseOS " + have, "Look for a newer BaseOS on GitHub.", "Check for update"],
    checking: ["Checking...", "Asking GitHub for the newest BaseOS.", ""],
    latest: ["BaseOS is up to date", "You have the newest BaseOS, " + have + ".", "Check again"],
    available: b.file
      ? ["BaseOS " + ver + " is out", "You have " + have + ". Made for your " + b.target + ". Games, saves and settings stay.", "Download"]
      : ["BaseOS " + ver + " is out", "You have " + have + ". Update it the BaseOS way, from its release page.", ""],
    downloading: ["Downloading BaseOS " + ver, b.total ? size(b.done) + " of " + size(b.total) : size(b.done), ""],
    ready: ["BaseOS " + ver + " is ready", "The update is on the card. Keep the console charged: it restarts and installs it while it starts.", "Install"],
    failed: ["That didn't work", b.error, "Try again"],
  }[b.state];
  const p = b.total ? Math.round(100 * b.done / b.total) : 0;
  return `<div class="base"><h2>${esc(title)}</h2><p>${esc(note || "")}</p>` +
    (b.state == "downloading" ? `<div class="bar"><i style="width:${p}%"></i></div>` : "") +
    (button ? `<button id="gobase" data-state="${b.state}">${button}</button>` : "") +
    `<div><a class="gh" href="${esc(b.link)}" target="_blank" rel="noopener">BaseOS on GitHub</a></div></div>`;
}
function baseosButton() {
  const b = update && update.baseos, go = $("gobase");
  if (!go || !b) return;
  go.onclick = async () => {
    try {
      if (b.state == "ready") {
        if (!confirm("Install BaseOS " + b.version + "? The console restarts and installs it while it starts. Keep it charged.")) return;
        await api("POST", "/api/update/baseos/install");
        $("update").innerHTML = "<h2>Restarting...</h2><p>BaseOS installs while the console starts. This can take a few minutes; this page closes with it.</p>";
        $("after").innerHTML = "";
        return;
      }
      await api("POST", "/api/update/baseos/" + (b.state == "available" ? "download" : "check"));
    } catch (err) { if (err.message) say(err.message); }
    checkUpdate();
  };
}
// Each visit looks on GitHub once by itself, so a newer release shows as a dot on the Update tab
// and a line above the tabs, without opening the tab first.
async function lookOnce() {
  try {
    let u = await (await api("GET", "/api/update")).json();
    if (u.state != "idle") return checkUpdate();
    quiet = true;
    await api("POST", "/api/update/check");
    for (let i = 0; i < 30; i++) {
      await new Promise(r => setTimeout(r, 1000));
      u = await (await api("GET", "/api/update")).json();
      if (u.state != "checking") break;
    }
  } catch (e) {}
  await checkUpdate();
  quiet = false;
}
function badge() {
  const u = update || {}, news = ["available", "downloading", "ready"].includes(u.state);
  const tab = $("tabs").querySelector('[data-s="UPDATE"]');
  if (tab) tab.classList.toggle("new", news);
  $("news").hidden = !news || UPDATE(sys);
  $("newsv").textContent = "slot. x GRAVY " + (u.version || "");
}
$("newsgo").onclick = () => $("tabs").querySelector('[data-s="UPDATE"]').click();
// The release's own notes from GitHub, as a small readme under the update, and its page.
function notes(u) {
  const link = u.link || "https://github.com/roygravy/slot/releases";
  const open = `<div><a class="gh" href="${esc(link)}" target="_blank" rel="noopener">${u.notes ? "Read it on GitHub" : "Release notes on GitHub"}</a></div>`;
  if (!u.notes || !["available", "downloading", "ready", "latest"].includes(u.state)) return open;
  const inline = t => esc(t)
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  let html = "", list = false, skip = false;
  for (const raw of u.notes.split("\n")) {
    const line = raw.trim();
    const head = line.match(/^#{1,4}\s+(.*)/);
    if (head) skip = /^install/i.test(head[1]);
    if (skip || /^-{3,}$/.test(line) || /^\*\*(Tag|Release title)/.test(line)) continue;
    const item = line.match(/^[-*]\s+(.*)/);
    if (list && !item) { html += "</ul>"; list = false; }
    if (head) html += `<h3>${inline(head[1])}</h3>`;
    else if (item) { if (!list) { html += "<ul>"; list = true; } html += `<li>${inline(item[1])}</li>`; }
    else if (line) html += `<p>${inline(line)}</p>`;
  }
  if (list) html += "</ul>";
  return `<div class="notes"><h3>What's new in ${esc(u.version)}</h3>${html}</div>` + open;
}
async function add(files) {
  if (UPDATE(sys)) {
    const zip = files.find(f => /\.zip$/i.test(f.name));
    if (!zip) return say("Drop the slot. x GRAVY zip, as it comes from GitHub");
    try { await send(zip, null, "/api/update/zip"); say(); } catch (err) { say(err.message); }
    $("up").innerHTML = "";
    return checkUpdate();
  }
  let added = 0, last = sys, wrong = "", one = "";
  for (const f of files) {
    // Each game goes to the shelf its file says, whichever tab is open.
    const ext = f.name.split(".").pop().toLowerCase();
    // A packed game never plays: say so at once, without sending it first.
    if (/^(zip|7z|rar|gz|tar)$/.test(ext)) { wrong = f.name + ": unzip it first, the console can't open ." + ext + " files"; continue; }
    // A .gb on the GBC tab and a Super Game Boy .sfc on the BIOS tab stay where they are dropped.
    const stays = (sys == "GBC" && ext == "gb") || (sys == "BIOS" && (ext == "sfc" || ext == "smc"));
    const to = EXT[ext] && !stays ? EXT[ext] : sys;
    try { await send(f, to); added++; last = to; one = f.name; } catch (err) { say(err.message); }
  }
  $("up").innerHTML = "";
  if (added) { sys = last; say(added == 1 ? "Added " + one : "Added " + added + " files"); }
  if (wrong) say(wrong);
  await load().catch(() => {});
}
$("pick").onchange = () => { add([...$("pick").files]); $("pick").value = ""; };
const drop = $("drop");
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); add([...e.dataTransfer.files]); };
