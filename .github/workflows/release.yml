name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version in the zip's name
        default: v1.1

permissions:
  contents: read

jobs:
  build:
    name: card tree
    runs-on: ubuntu-24.04-arm
    container: rust:1-bullseye
    outputs:
      zip: ${{ steps.package.outputs.zip }}
    steps:
      - uses: actions/checkout@v7

      - name: Install zip, cmake and Task
        run: |
          set -eu
          # A test build from a branch: its name's slashes cannot stand in a folder or zip name.
          echo "BUILD_NAME=$(printf %s "$GITHUB_REF_NAME" | tr / -)" >> "$GITHUB_ENV"
          sed -i '/bullseye-security/d' /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends zip cmake
          curl -fsSL https://taskfile.dev/install.sh | sh -s -- -b /usr/local/bin

      - name: Build the tree
        run: task dist:device OUT="slot-${BUILD_NAME}"

      - name: Check what is about to ship
        run: |
          set -eu
          out="slot-${BUILD_NAME}"
          file "$out/System/slot" | grep -q aarch64
          file "$out/System/slot-services" | grep -q aarch64
          file "$out/System/slot-net/iw" | grep -q aarch64
          test -f "$out/Config/wifi.toml.example"
          file "$out/System/mgba_libretro.so" | grep -q aarch64
          file "$out/System/gpsp_libretro.so" | grep -q aarch64
          file "$out/System/fceumm_libretro.so" | grep -q aarch64
          file "$out/System/snes9x_libretro.so" | grep -q aarch64
          test -x "$out/System/slot"
          gpsp_src_sha="$(cat vendor/gpsp-src.sha)"
          test -f "$out/System/licenses/gpsp-${gpsp_src_sha}.tar.gz"
          test -f "$out/System/licenses/gpsp-${gpsp_src_sha}.meta"
          for p in cores/gpsp/*.patch; do
            test -f "$out/System/licenses/gpsp-$(basename "$p")"
          done
          mgba_src_commit="$(grep '^commit=' vendor/mgba_libretro.so.meta | cut -d= -f2)"
          test -f "$out/System/licenses/mgba-${mgba_src_commit}.meta"
          for p in cores/mgba/*.patch; do
            test -f "$out/System/licenses/mgba-$(basename "$p")"
          done
          for p in cores/gambatte/*.patch; do
            test -f "$out/System/licenses/gambatte-$(basename "$p")"
          done

      - name: Package
        id: package
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -eu
          # The zip and its folder carry the GRAVY name: slot-x-gravy-v1.1.zip holds slot-x-gravy-v1.1/.
          out="slot-x-gravy-$(printf %s "$VERSION" | tr / -)"
          mv "slot-${BUILD_NAME}" "$out"
          # The GRAVY Manager compares this with the newest release.
          printf '%s\n' "$VERSION" > "$out/System/version.txt"
          zip="$out.zip"
          zip -qry "$zip" "$out"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.zip }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

  publish:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.zip }}

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ needs.build.outputs.zip }}
        run: |
          set -eu
          cat > notes.md <<NOTES
          Unzip and copy the contents of \`slot-x-gravy-${GITHUB_REF_NAME}/\` onto SD2.

          Emulation by mGBA (MPL-2.0), gpSP (GPL-2.0), Gambatte (GPL-2.0), FCEUmm (GPL-2.0) and Snes9x (non-commercial licence). Their licences, patches and sources are in \`System/licenses/\`.
          NOTES
          # A release already made by hand for this tag just gets the zip; otherwise one is made.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi